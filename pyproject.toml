[project]
name = "python-csharp-rpc-bridge"
version = "0.1.0"
description = "Build-time Python-to-C# RPC bridge generator and runtime"
readme = "README.md"
authors = [
    { name = "yikomugua", email = "2556722862@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "nuitka>=4.3.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
python-csharp-rpc-bridge = "python_csharp_rpc_bridge:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
